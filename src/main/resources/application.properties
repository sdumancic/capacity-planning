quarkus.http.host=127.0.0.1
quarkus.datasource.db-kind=mssql
quarkus.datasource.username=${DB_USERNAME:sa}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=capacity_planning;encrypt=true;trustServerCertificate=true}
quarkus.datasource.devservices.enabled=false
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog.xml
quarkus.liquibase.contexts=base
%dev.quarkus.liquibase.contexts=base,demo
capacity.business-zone=${CAPACITY_BUSINESS_ZONE}
quarkus.jackson.timezone=${CAPACITY_BUSINESS_ZONE}
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.write-durations-as-timestamps=false

# Keep v3 opt-in outside local development.
%dev.capacity.v3.enabled=true

# Dummy Hub conflicts are opt-in outside dev; 1 forces rejection, 0 disables it.
capacity.hub.dummy-conflict-probability=0
%dev.capacity.hub.dummy-conflict-probability=0.35

# Hub sync after commit (per request) and outbox worker poll interval.
capacity.hub.sync-budget=3s
capacity.hub.worker-interval=2s
